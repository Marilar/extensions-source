name: Build Kumanga APK Manual

on:
  workflow_dispatch:

permissions: {}

jobs:
  build:
    name: Build Kumanga Extension
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Build KuManga
        run: |
          ./gradlew :src:es:kumanga:assembleDebug

      - name: Upload Kumanga APK
        uses: actions/upload-artifact@v4
        with:
          name: kumanga-apk
          path: "**/*.apk"
